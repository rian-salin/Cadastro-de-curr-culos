server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # O padrão do Nginx é 1 MB. A API aceita PDF de até 5 MB; a folga cobre o multipart
        # e faz um arquivo um pouco maior chegar à API, que responde com mensagem clara.
        client_max_body_size 10m;
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
