services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD — copie .env.example para .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql

  api:
    build: ./backend/CadastroCurriculos.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: "Server=db,1433;Database=${DB_NAME:?defina DB_NAME — copie .env.example para .env};User Id=sa;Password=${DB_PASSWORD:?defina DB_PASSWORD — copie .env.example para .env};TrustServerCertificate=True;Connect Timeout=5;"
    ports:
      - "5000:5000"
    depends_on:
      - db

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db-data:
