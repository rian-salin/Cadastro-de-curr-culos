# Stack completa: SQL Server + API + frontend.
#
#   docker compose up --build
#
# As variáveis abaixo têm um valor padrão de desenvolvimento, para um clone novo
# subir sem nenhum passo anterior. Um .env na raiz (copie de .env.example)
# sobrescreve qualquer uma delas.
#
# Atenção: o SQL Server só define a senha do `sa` na primeira subida, quando
# cria o volume. Trocar DB_PASSWORD depois disso exige recriar o volume
# (`docker compose down -v`, que apaga os dados).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-ChangeMe_2026!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend/CadastroCurriculos.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=db,1433;Database=${DB_NAME:-CadastroCurriculosDb};User Id=sa;Password=${DB_PASSWORD:-ChangeMe_2026!};TrustServerCertificate=True;Connect Timeout=5;"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db-data:
